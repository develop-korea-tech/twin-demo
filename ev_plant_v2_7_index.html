<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV Body & Assembly Plant — Digital Twin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--mute:#7b8794;--line:#e6e9ec;--card:rgba(255,255,255,.94);--pink:#e8547e;--green:#3cb371;--amber:#f0b429;--teal:#2bb3a1;--blue:#2f7fd6;--red:#d3352b;--mint:#3cb371}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9ebed;font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9ebed;color:var(--mute);font-size:14px;z-index:99}
  .hud{position:fixed;z-index:5;user-select:none}
  .card{background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(31,41,51,.10),0 1px 2px rgba(31,41,51,.06);backdrop-filter:blur(8px)}
  #status{left:14px;top:14px;padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
  #status #clock{font-weight:600;font-size:14px}#status #clock small{display:none}#status .num{font-weight:700}
  #status .grade{font-size:9px;font-weight:700;padding:3px 7px;border-radius:999px;color:#fff;background:var(--green)}
  #status .state{font-size:9px;font-weight:700;padding:3px 7px;border-radius:999px;background:#e3f6ee;color:#1f8a5b;letter-spacing:.4px}#status .state.stop{background:#fde6e4;color:var(--red)}
  #tops{right:14px;top:14px;display:flex;gap:8px}
  #tops button{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:0 6px 18px rgba(31,41,51,.12);cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}#tops button svg{width:18px;height:18px}#tops button.on{background:var(--ink);color:#fff}
  .panel{display:none}.panel.open{display:block}
  #right{right:14px;top:62px;width:262px;padding:14px 14px 10px;max-height:calc(100vh - 170px);overflow:auto}
  #right::-webkit-scrollbar{width:0}
  #right h2{font-size:13px;margin:0 0 10px;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
  #right select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;color:var(--ink);max-width:150px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border-radius:12px;padding:10px 10px 8px}.tile .v{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.tile .v small{font-size:10px;font-weight:600;margin-left:2px}.tile .l{font-size:9.5px;font-weight:600;letter-spacing:.4px;margin-top:5px;text-transform:uppercase;opacity:.85}
  .t-pink{background:#fbe1e9;color:#b8305a}.t-green{background:#dff3ea;color:#1f7a4d}.t-amber{background:#fdf0cc;color:#8a6410}.t-teal{background:#d8f1ee;color:#1a7a70}
  #right h3{font-size:10.5px;color:var(--mute);letter-spacing:.6px;text-transform:uppercase;margin:14px 0 6px}
  #chart{width:100%;height:88px;display:block}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 0}.row b{font-weight:600;font-variant-numeric:tabular-nums}.row em{font-style:normal;color:var(--mute);font-size:10px;margin-left:4px}
  .bar{height:5px;border-radius:3px;background:#eef1f3;margin:1px 0 4px}.bar i{display:block;height:100%;border-radius:3px;background:var(--teal)}
  .def .bar i{background:var(--pink)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%}
  #views{left:14px;bottom:14px;display:flex;gap:10px}
  #views button{width:62px;height:62px;border-radius:50%;border:none;background:#fff;box-shadow:0 6px 18px rgba(31,41,51,.12);font:inherit;font-size:9.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.1}
  #views button svg{width:20px;height:20px}#views button.on{background:#f28c28;color:#fff;box-shadow:0 6px 18px rgba(242,140,40,.35)}#views button.on svg{stroke:#fff}
  #bottom{left:50%;bottom:90px;transform:translateX(-50%);width:min(640px,calc(100vw - 28px));padding:10px 14px 8px}
  #bottom .top{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--mute);margin-bottom:6px}#bottom .t{font-weight:700;color:var(--ink);letter-spacing:.3px}
  #bottom .live{font-size:9px;font-weight:700;color:var(--red);padding:2px 6px;border-radius:999px;background:#fde6e4}.sp{flex:1}
  #bottom button{font:inherit;font-size:10px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:3px 8px;cursor:pointer}#bottom button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .legend{display:flex;gap:8px;font-size:9.5px;color:var(--mute)}.legend span{display:flex;align-items:center;gap:4px}
  #tl{position:relative;height:22px;border-radius:6px;background:#f1f3f5;overflow:visible;margin:4px 0 8px}
  #tlfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#d8f1ee,#c9ecf6);border-radius:6px}
  #tlnow{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
  .tick{position:absolute;top:100%;font-size:8.5px;color:var(--mute);transform:translateX(-50%);margin-top:2px}
  .mark{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}.mark.defect{background:var(--red)}.mark.warn{background:var(--amber)}.mark.info{background:var(--blue)}
  #evts{max-height:78px;overflow:hidden;margin-top:12px;font-size:10.5px}
  .ev{display:flex;gap:8px;align-items:center;padding:2px 0;color:var(--ink)}.ev time{color:var(--mute);font-variant-numeric:tabular-nums}.ev b{font-weight:600;color:var(--blue)}.ev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4}
  .op{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px 4px 6px;font-size:10.5px;box-shadow:0 4px 14px rgba(31,41,51,.14);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:opacity .25s}
  .op b{background:var(--ink);color:#fff;border-radius:999px;padding:2px 6px;font-size:9.5px;font-weight:700}.op span{color:var(--mute);display:flex;flex-direction:column;line-height:1.25}.op span em{font-style:normal;color:var(--blue);font-weight:600;font-size:10px}
  .act{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:rgba(31,41,51,.82);color:#fff;border-radius:999px;padding:3px 8px;font-size:9.5px;font-weight:500;white-space:nowrap;box-shadow:0 3px 10px rgba(31,41,51,.2)}
  .act::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:10px;background:rgba(31,41,51,.5)}
  .op.warn b{background:var(--amber)}.op.defect b{background:var(--red)}.op.sel{outline:2px solid var(--blue)}
  .ai{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(31,41,51,.18);white-space:nowrap}
  .ai i{font-style:normal;color:var(--blue)}.ai::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:var(--h,60px);background:var(--blue);transform:translateX(-50%)}
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(12px);background:#1f2933;color:#fff;padding:9px 16px;border-radius:12px;font-size:12px;opacity:0;transition:.3s;pointer-events:none;z-index:8;box-shadow:0 8px 24px rgba(0,0,0,.2)}#toast.show{opacity:1;transform:translateX(-50%)}
  #credit{position:fixed;right:18px;bottom:8px;font-size:9.5px;color:var(--mute);z-index:5}
  @media (max-width:700px){
    #status{padding:6px 10px;gap:7px;font-size:11px}#status .grade{display:none}
    #right{left:12px;right:12px;width:auto;top:62px;max-height:calc(100vh - 170px)}
    #views{left:10px;right:10px;justify-content:space-between;gap:6px}#views button{width:54px;height:54px;font-size:9px}#views button svg{width:17px;height:17px}
    #bottom{bottom:80px;width:calc(100vw - 24px)}#bottom .legend{display:none}#evts{max-height:60px}
    .op{font-size:9.5px;padding:3px 8px 3px 4px}#credit{display:none}#toast{bottom:150px;font-size:11px;max-width:90vw;white-space:normal;text-align:center}
  }
</style>
</head>
<body>
<div id="load">공장 모델 불러오는 중…</div>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="status" class="hud card"><span id="clock">06:00:00<small id="clockDate"></small></span><span class="num" id="rateNum">60.0 JPH</span><span class="grade" id="rateGrade">EXCELLENT</span><span class="state" id="lineState">IN OPERATION</span></div>
<div id="tops" class="hud"><button id="tNum" title="숫자·KPI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="3" width="4" height="18"/></svg></button><button id="tTime" title="타임라인·이벤트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></div>

<div id="right" class="hud card panel">
  <h2><span>NUMBERS</span><select id="opSel"><option value="">전체 공장</option></select></h2>
  <div class="tiles">
    <div class="tile t-pink"><div class="v" id="kProd">0<small>대</small></div><div class="l">금일 생산</div></div>
    <div class="tile t-green"><div class="v" id="kGood">0<small>대</small></div><div class="l">양품 · 직행</div></div>
    <div class="tile t-amber"><div class="v" id="kDef">0<small>대</small></div><div class="l">리페어</div></div>
    <div class="tile t-teal"><div class="v" id="ftt">100<small>%</small></div><div class="l">직행률 FTT</div></div>
  </div>
  <h3>생산 누적 vs 계획</h3>
  <svg id="chart" viewBox="0 0 228 88" preserveAspectRatio="none"></svg>
  <div class="row"><span>현재 실적 / 계획</span><b><span id="rAct">0</span> / <span id="rPlan">0</span> 대</b></div>
  <div class="bar"><i id="rBar" style="width:0%"></i></div>
  <div class="row"><span>차이 (실적-계획)</span><b id="rDiff">0 대</b></div>
  <h3>존별 OEE · 자동화율</h3>
  <div id="zones"></div>
  <h3>Top 5 결함 유형</h3>
  <div id="top5"></div>
  <h3>공정별 상태</h3>
  <div id="opStates"></div>
</div>

<div id="views" class="hud">
  <button id="mAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>전체 보기</button>
  <button id="mTour" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>공정 투어</button>
  <button id="mFlow" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 7c3 2 7 2 10 0M12 16c-2-4-5-6-7-8M12 16c2-4 5-6 7-8"/></svg>데이터 흐름</button>
  <button id="mFree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5l7 4-7 4-7-4 7-4z"/><path d="M5 13l7 4 7-4"/></svg>자유 시점</button>
</div>

<div id="bottom" class="hud card panel">
  <div class="top">
    <span class="t">DAILY PRODUCTION TIMELINE</span><span class="live">LIVE</span>
    <span class="sp"></span>
    <button id="bPlay" class="on">재생</button>
    <button id="bSpeed" data-i="1">x60</button>
    <button id="bReset">처음부터</button>
    <div class="legend"><span><i class="dot" style="background:var(--green)"></i>가동</span><span><i class="dot" style="background:var(--amber)"></i>주의</span><span><i class="dot" style="background:var(--red)"></i>불량</span><span><i class="dot" style="background:var(--blue)"></i>정보</span></div>
  </div>
  <div id="tl"><div id="tlfill"></div><div id="tlnow"></div></div>
  <div id="evts"></div>
</div>

<div id="toast"></div>
<div id="credit">WebGL real-time · SSAO · 모든 3D 모델은 코드 생성 (외부 자산 없음)</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SSAOShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
<script>
/* =========================================================
   EV BODY & ASSEMBLY PLANT — 디지털 트윈 데모 (Three.js r128, 단일 HTML)
   구조: 설정 → 렌더러 → 재질/헬퍼 → 공장 환경 → 로봇/휴머노이드/차체 생성기 → 스테이션(공정 연출) → 라인 비트(차체 흐름) → 프레스 존 → HUD/시나리오 → 카메라 → 루프
   ========================================================= */
// ---------- 1. 설정 ----------
const ZONES = [
  {id:'A', name:'프레스',  auto:100, x0:-104, x1:-62, floor:0x676d72},
  {id:'B', name:'차체',    auto:100, x0:-62,  x1:-16, floor:0x7a8288},
  {id:'C', name:'도장',    auto:95,  x0:-16,  x1:17,  floor:0x9ba3a8},
  {id:'D', name:'의장',    auto:40,  x0:17,   x1:64,  floor:0x858c92},
];
const PITCH = 11;                       // 스테이션 간격(m)
const X0 = -55;                         // OP20 위치
const STATIONS = [
  {id:'OP10',  name:'탠덤 프레스 라인',     zone:'A', x:-82,  ai:'Quality',    press:true},
  {id:'OP20',  name:'사이드 패널 용접',     zone:'B', x:X0+0*PITCH,  ai:'Recipe'},
  {id:'OP30',  name:'메인벅 프레이밍',      zone:'B', x:X0+1*PITCH,  ai:'Recipe'},
  {id:'OP40',  name:'루프 레이저 브레이징·헤밍', zone:'B', x:X0+2*PITCH, ai:null},
  {id:'OP50',  name:'차체 정도 검사',       zone:'B', x:X0+3*PITCH,  ai:'Quality'},
  {id:'OP60',  name:'전착 도장 (RoDip)',    zone:'C', x:X0+4*PITCH,  ai:null},
  {id:'OP70',  name:'상도 부스',            zone:'C', x:X0+5*PITCH,  ai:'Inspection'},
  {id:'OP80',  name:'건조 오븐',            zone:'C', x:X0+6*PITCH,  ai:null},
  {id:'OP90',  name:'도어 탈거·콕핏 모듈',  zone:'D', x:X0+7*PITCH,  ai:null},
  {id:'OP100', name:'마리아지 (배터리팩)',  zone:'D', x:X0+8*PITCH,  ai:'Quality'},
  {id:'OP110', name:'휠·글라스 장착',       zone:'D', x:X0+9*PITCH,  ai:null},
  {id:'OP120', name:'EOL 검사·출하',        zone:'D', x:X0+10*PITCH, ai:null},
];
const LINE_STATIONS = STATIONS.filter(s=>!s.press);   // 차체가 지나가는 11개
const BEAT = 18, TRANSFER = 6;          // 연출 택트(초): 이송 6초 + 작업 12초
const HANG_Y = .9;                      // 의장 존 행어 높이
const PAINT_COLORS = [0xf2f4f5, 0xb8202a, 0x1f4f9c, 0x1b1e22, 0xb9c0c5, 0x2f7d5b];
const SCENARIO = [
  {t:'06:00', type:'info',   op:null,    msg:'1직 가동 시작 — 목표 60 JPH'},
  {t:'07:40', type:'warn',   op:'OP20',  msg:'용접팁 마모 예측 82% — Recipe.AI 드레싱 주기 재계산', dtype:'용접 스패터'},
  {t:'07:55', type:'ok',     op:'OP20',  msg:'팁 드레싱 완료, 정상 복귀'},
  {t:'09:20', type:'defect', op:'OP70',  msg:'도장 결함 감지 — 먼지(Dirt) #D-014, Inspection.AI 판정', dtype:'먼지'},
  {t:'09:31', type:'ok',     op:'OP70',  msg:'부스 필터 교체, 해당 차체 리페어 라인 이송'},
  {t:'11:05', type:'warn',   op:'OP10',  msg:'프레스 #3 금형 온도 상승 — 슬라이드 속도 10% 저감', dtype:'프레스 주름'},
  {t:'11:25', type:'ok',     op:'OP10',  msg:'금형 냉각 정상화'},
  {t:'13:10', type:'defect', op:'OP50',  msg:'루프-사이드 갭 공차 이탈 +0.8mm — Quality.AI 판정', dtype:'갭·단차'},
  {t:'13:19', type:'ok',     op:'OP50',  msg:'프레이밍 지그 오프셋 보정 완료'},
  {t:'14:45', type:'defect', op:'OP100', msg:'배터리팩 체결 토크 미달 — 리트라이 실패', dtype:'체결 토크'},
  {t:'14:53', type:'ok',     op:'OP100', msg:'너트러너 교체, 재체결 합격'},
  {t:'16:30', type:'warn',   op:'OP90',  msg:'콕핏 모듈 서열 지연 4분 — 휴머노이드 서열 로봇 투입', dtype:'서열 지연'},
  {t:'16:38', type:'ok',     op:'OP90',  msg:'서열 정상화'},
  {t:'18:00', type:'info',   op:null,    msg:'1직 종료'},
];
const DAY_START=6*60, DAY_END=18*60, TAKT_MIN=1.0;   // 60 JPH

// ---------- 2. 렌더러 / 씬 / 후처리 (화이트 클린 CAD 스타일: 고키 조명 + SSAO) ----------
window.createImageBitmap=undefined;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});

  if(tour.idx===STATIONS.length){ tour.t+=dt; const k=Math.min(1,tour.t/10); camera.position.lerpVectors(HOME.pos,OV_B.pos,k); controls.target.lerpVectors(HOME.tgt,OV_B.tgt,k); if(k>=1){ tour.idx=0; tour.t=0; const s=shotOf(STATIONS[0].id); flyTo(s.a.clone(),s.tgt.clone(),2.4); selectLabel(STATIONS[0].id);} return; }
  const s=shotOf(STATIONS[tour.idx].id); tour.t+=dt; const dur=STATIONS[tour.idx].id==='OP30'?BEAT:9; const k=Math.min(1,tour.t/dur); camera.position.lerpVectors(s.a,s.b,k); controls.target.copy(s.tgt);
  if(k>=1){ tour.idx=(tour.idx+1)%total; tour.t=0; if(tour.idx<STATIONS.length){ const n=shotOf(STATIONS[tour.idx].id); flyTo(n.a.clone(),n.tgt.clone(),2.0); selectLabel(STATIONS[tour.idx].id);} else { flyTo(HOME.pos.clone(),HOME.tgt.clone(),3.0); selectLabel(null);} } }

// ---------- 11. 시나리오 / KPI ----------
const S={t:DAY_START,playing:true,speed:60,evIdx:0,prod:0,good:0,def:0,states:{},defects:{},downMin:0,downZone:{A:0,B:0,C:0,D:0},hist:[]};
STATIONS.forEach(s=>S.states[s.id]='run');
const SPEEDS=[10,60,300], toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m;}, fmt=min=>{const h=Math.floor(min/60),m=Math.floor(min%60),s=Math.floor((min*60)%60);return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');}, $=id=>document.getElementById(id);
(function buildTimeline(){ const tl=$('tl'); for(let h=DAY_START;h<=DAY_END;h+=60){ const e=document.createElement('div'); e.className='tick'; e.style.left=((h-DAY_START)/(DAY_END-DAY_START)*100)+'%'; e.textContent=String(h/60).padStart(2,'0')+':00'; tl.appendChild(e); }
  SCENARIO.filter(e=>e.type!=='ok').forEach(e=>{ const m=document.createElement('div'); m.className='mark '+(e.type==='defect'?'defect':e.type==='warn'?'warn':'info'); m.style.left=((toMin(e.t)-DAY_START)/(DAY_END-DAY_START)*100)+'%'; m.title=e.t+' '+e.msg; tl.appendChild(m); }); })();
function setStationState(id,state){ S.states[id]=state; labels[id].className='op'+(state==='run'?'':' '+state)+(labels[id].classList.contains('sel')?' sel':''); }
let toastT=0; function toast(msg,ms=4500){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }
function pushEvent(e){ const el=document.createElement('div'); el.className='ev'; const c=e.type==='defect'?'var(--red)':e.type==='warn'?'var(--amber)':e.type==='ok'?'var(--mint)':'var(--blue)'; el.innerHTML=`<i class="dot" style="background:${c}"></i><time>${e.t}</time>${e.op?`<b>${e.op}</b>`:''}<span>${e.msg}</span>`; const b=$('evts'); b.prepend(el); while(b.children.length>12) b.lastChild.remove(); }
function applyEvent(e){ pushEvent(e);
  if(e.op){ setStationState(e.op,e.type==='ok'?'run':e.type);
    if(e.type==='defect'){ S.def+=1; S.defects[e.dtype]=(S.defects[e.dtype]||0)+1; const i=LINE_STATIONS.findIndex(s=>s.id===e.op); const b=bodies.find(x=>x.slot===i); if(b) b.ng=true; }
    if(e.type!=='ok'){ const ai=STATIONS.find(s=>s.id===e.op).ai; if(ai){ aiTarget=e.op; aiEl.innerHTML=`${ai}<i>.AI</i>`; aiUntil=S.t+18; } const s=shotOf(e.op); flyTo(s.a.clone().lerp(s.b,.5),s.tgt,1.8); selectLabel(e.op); holdUntil=performance.now()+8000; if(mode==='tour'){ tour.idx=STATIONS.findIndex(s=>s.id===e.op); tour.t=4; } }
    else if(aiTarget===e.op) aiUntil=Math.min(aiUntil,S.t+3); }
  toast(e.msg); }
function tick(dtMin){ if(!S.playing||S.t>=DAY_END) return; const prev=S.t; S.t=Math.min(DAY_END,S.t+dtMin); const d=S.t-prev;
  const stopped=STATIONS.some(s=>S.states[s.id]==='defect'); if(stopped) S.downMin+=d; ZONES.forEach(z=>{ if(STATIONS.some(s=>s.zone===z.id&&S.states[s.id]==='defect')) S.downZone[z.id]+=d; });
  const shouldProd=Math.floor((S.t-DAY_START-S.downMin)/TAKT_MIN); if(shouldProd>S.prod) S.prod=shouldProd;
  const hi=Math.floor((S.t-DAY_START)/30); if(S.hist.length<=hi) S.hist.push({t:S.t,prod:S.prod,plan:Math.floor((S.t-DAY_START)/TAKT_MIN)});
  while(S.evIdx<SCENARIO.length&&toMin(SCENARIO[S.evIdx].t)<=S.t){ applyEvent(SCENARIO[S.evIdx]); S.evIdx++; }
  if(aiTarget&&S.t>=aiUntil){ aiTarget=null; aiEl.style.display='none'; } }
function renderKPI(){ S.good=Math.max(0,S.prod-S.def); const elapsed=Math.max(1,S.t-DAY_START), avail=(elapsed-S.downMin)/elapsed, jph=S.prod/(elapsed/60);
  $('kProd').innerHTML=S.prod+'<small>대</small>'; $('kGood').innerHTML=S.good+'<small>대</small>'; $('kDef').innerHTML=S.def+'<small>대</small>';
  $('rateNum').textContent=(elapsed<3?60:jph).toFixed(1)+' JPH'; const g=$('rateGrade'); const rate=avail*100; g.textContent=rate>=95?'EXCELLENT':rate>=85?'GOOD':'CHECK'; g.style.background=rate>=95?'var(--mint)':rate>=85?'var(--amber)':'var(--red)';
  const stopped=STATIONS.some(s=>S.states[s.id]==='defect'); $('lineState').textContent=S.t>=DAY_END?'SHIFT END':stopped?'LINE STOP':'IN OPERATION'; $('lineState').classList.toggle('stop',stopped);
  $('clock').firstChild.textContent=fmt(S.t); const pct=(S.t-DAY_START)/(DAY_END-DAY_START)*100; $('tlfill').style.width=pct+'%'; $('tlnow').style.left=pct+'%';
  const plan=Math.floor(elapsed/TAKT_MIN); $('rAct').textContent=S.good; $('rPlan').textContent=plan; $('rBar').style.width=Math.min(100,S.good/Math.max(1,plan)*100)+'%'; const diff=S.good-plan; $('rDiff').textContent=(diff>0?'+':'')+diff+' 대'; $('rDiff').style.color=diff<0?'var(--red)':'var(--mint)';
  $('ftt').innerHTML=(S.prod?S.good/S.prod*100:100).toFixed(1)+'<small>%</small>'; renderChart();
  $('zones').innerHTML=ZONES.map(z=>{ const a=(elapsed-S.downZone[z.id])/elapsed; const oee=a*.97*(S.prod?S.good/S.prod:1)*100; return `<div class="row"><span>${z.id} ${z.name} <em>${z.auto}%</em></span><b>${oee.toFixed(1)}%</b></div><div class="bar"><i style="width:${oee}%"></i></div>`; }).join('');
  const tot=Object.values(S.defects).reduce((a,b)=>a+b,0)||1;
  $('top5').innerHTML=Object.entries(S.defects).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v],i)=>`<div class="def"><div class="row"><span>${String(i+1).padStart(2,'0')} ${k}</span><b>${(v/tot*100).toFixed(1)}%</b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`).join('')||'<div class="row" style="color:var(--mute)">발생 없음</div>';
  $('opStates').innerHTML=STATIONS.map(o=>{const s=S.states[o.id];const c=s==='defect'?'var(--red)':s==='warn'?'var(--amber)':'var(--mint)';return `<div class="row"><span><i class="dot" style="background:${c};margin-right:6px"></i>${o.id}</span><span style="color:var(--mute)">${s==='run'?'가동':s==='warn'?'주의':'정지'}</span></div>`;}).join(''); }

function renderChart(){ const W=228,H=88,L=6,B=14; const pts=[{t:DAY_START,prod:0,plan:0},...S.hist,{t:S.t,prod:S.prod,plan:Math.floor((S.t-DAY_START)/TAKT_MIN)}]; const mx=Math.max(60,(S.t-DAY_START)/TAKT_MIN*1.05,720*((S.t-DAY_START)/720));
  const X=t=>L+(t-DAY_START)/(DAY_END-DAY_START)*(W-L*2), Y=v=>H-B-v/720*(H-B-6);
  const line=k=>pts.map(p=>`${X(p.t).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');
  const area=`M${X(DAY_START)},${Y(0)} L`+line('prod')+` L${X(S.t).toFixed(1)},${Y(0)} Z`;
  const last=pts[pts.length-1]; const ticks=[6,9,12,15,18].map(h=>`<text x="${X(h*60).toFixed(1)}" y="${H-2}" font-size="8" fill="#98a2ad" text-anchor="middle">${h}:00</text>`).join('');
  $('chart').innerHTML=`<path d="${area}" fill="#f9d7e2"/><polyline points="${line('plan')}" fill="none" stroke="#b8c0c8" stroke-width="1.2" stroke-dasharray="3 3"/><polyline points="${line('prod')}" fill="none" stroke="#e8547e" stroke-width="2"/><circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.prod).toFixed(1)}" r="3" fill="#e8547e" stroke="#fff" stroke-width="1.5"/>${ticks}`; }
$('bPlay').onclick=()=>{ S.playing=!S.playing; $('bPlay').textContent=S.playing?'재생':'일시정지'; $('bPlay').classList.toggle('on',S.playing); };
$('bSpeed').onclick=e=>{ const i=(Number(e.target.dataset.i)+1)%SPEEDS.length; e.target.dataset.i=i; S.speed=SPEEDS[i]; e.target.textContent='x'+S.speed; };
$('bReset').onclick=()=>{ Object.assign(S,{t:DAY_START,evIdx:0,prod:0,good:0,def:0,downMin:0,defects:{},downZone:{A:0,B:0,C:0,D:0},hist:[]}); STATIONS.forEach(o=>setStationState(o.id,'run')); $('evts').innerHTML=''; aiTarget=null; aiEl.style.display='none'; bodies.forEach(b=>b.ng=false); };
$('clockDate').textContent='';

// ---------- 12. 정적 병합 + 루프 ----------
// 색 공간 일괄 변환 (병합 전에 해야 정점색에도 반영됨)
(function(){ const seen=new Set(); const conv=m=>{ if(!m||seen.has(m)||m.userData.lin) return; seen.add(m); m.userData.lin=true; if(m.color&&!m.vertexColors) m.color.convertSRGBToLinear(); if(m.emissive) m.emissive.convertSRGBToLinear(); }; Object.values(M).forEach(conv); scene.traverse(o=>{ if(o.material) [].concat(o.material).forEach(conv); }); })();
mergeStatic(envG); Object.values(stations).forEach(st=>mergeStatic(st.g));
(function(){ const list=[]; scene.traverse(o=>{ if(o.userData.dyn&&!o.isMesh&&!o.userData.noMerge) list.push(o); }); list.forEach(o=>mergeStatic(o)); })();
addEdges(envG); Object.values(stations).forEach(st=>addEdges(st.g));
let qLevel=0, renderScale=1;
function resize(){ const w=Math.round(innerWidth*renderScale), h=Math.round(innerHeight*renderScale); renderer.setSize(w,h,false); composer.setSize(w,h); const pr=renderer.getPixelRatio(); fxaa.material.uniforms.resolution.value.set(1/(w*pr),1/(h*pr)); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
let last=performance.now(), kpiAcc=0, T=0, perfN=0, perfAcc=0, perfDone=false;
function shadowLow(){ sun.shadow.mapSize.set(1024,1024); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } }
function lowerQuality(){ qLevel++; // 모바일은 선명도 우선(SSAO를 먼저 끔), 데스크톱은 AO 우선(해상도를 먼저 낮춤)
  if(IS_MOBILE){ if(qLevel===1){ shadowLow(); console.info('성능 모드 1: 그림자 1024'); } else if(qLevel===2){ ssao.enabled=false; renderPass.enabled=true; console.info('성능 모드 2: SSAO 끔'); } else { renderScale=.8; resize(); console.info('성능 모드 3: 해상도 0.8'); } }
  else { if(qLevel===1){ renderer.setPixelRatio(1); resize(); console.info('성능 모드 1: 픽셀비 1.0'); } else if(qLevel===2){ shadowLow(); renderScale=.8; resize(); console.info('성능 모드 2: 그림자 1024, 해상도 0.8'); } else { ssao.enabled=false; renderPass.enabled=true; console.info('성능 모드 3: SSAO 끔'); } } }
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){ const dt=Math.min(.1,(now-last)/1000); last=now; T+=dt;
  tick(dt*S.speed/60);
  if(lerpCam){ const k=Math.min(1,(now-lerpCam.s)/lerpCam.d), e=1-Math.pow(1-k,3); camera.position.lerpVectors(lerpCam.p0,lerpCam.p1,e); controls.target.lerpVectors(lerpCam.t0,lerpCam.t1,e); if(k>=1) lerpCam=null; }
  updateTour(dt,now); controls.update();
  if(!reduced){ lineUpdate(dt); pressUpdate(dt); agvUpdate(); humanoidsUpdate(T,dt); flowUpdate(T); Object.values(stations).forEach(st=>st.idle(T,dt)); anims.forEach(f=>f(T,dt)); }
  composer.render();
  if(!perfDone&&T>3){ perfN++; perfAcc+=dt; if(perfN>=90){ if(perfAcc/perfN>1/28){ lowerQuality(); perfN=0; perfAcc=0; if(qLevel>=3) perfDone=true; } else perfDone=true; } }
  updateLabels(); kpiAcc+=dt; if(kpiAcc>.25){ kpiAcc=0; renderKPI(); }
  requestAnimationFrame(loop); }
renderKPI(); document.getElementById('load').remove(); setMode('tour'); requestAnimationFrame(loop);
flow.group.visible=flow.on;

</script>
